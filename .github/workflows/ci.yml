name: Build and test

on:
  push:
    branches: [master]
    tags: ['*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: node -e 'const m = require("./manifest.json"); if (m.version !== process.env.GITHUB_REF_NAME) throw new Error("Tag must match manifest version");'
      - name: Save release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: zadachi-release
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  attest-release:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: zadachi-release
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
