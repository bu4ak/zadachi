name: Build and test

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: node -e 'const m = require("./manifest.json"); if (m.version !== process.env.GITHUB_REF_NAME) throw new Error("Tag must match manifest version");'
      - name: Package manual installation
        if: github.ref_type == 'tag'
        run: |
          mkdir -p dist/zadachi
          cp main.js manifest.json styles.css LICENSE dist/zadachi/
          cd dist
          zip -q -r "zadachi-${GITHUB_REF_NAME}.zip" zadachi
      - name: Save release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: zadachi-release
          path: |
            main.js
            manifest.json
            styles.css
            LICENSE
            dist/*.zip
          if-no-files-found: error
